<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/moctelogo.png" />
    <link rel="apple-touch-icon" href="/moctelogo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moctezuma Records — Vinilos en la Ciudad de México</title>
    <meta name="description" content="Tienda de vinilos en la Ciudad de México. Encuentra discos de segunda mano y nuevos: LP, CD, 12&quot;, 7&quot; y más. Envío a domicilio o recoge en tienda." />
    <meta name="keywords" content="vinilos, discos, LP, CD, música, CDMX, Ciudad de México, segunda mano, Moctezuma Records, tienda de vinilos" />
    <meta name="author" content="Moctezuma Records" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:title" content="Moctezuma Records — Vinilos en la Ciudad de México" />
    <meta property="og:description" content="Tienda de vinilos en la CDMX. Discos de segunda mano y nuevos: LP, CD, 12&quot;, 7&quot; y más." />
    <meta property="og:image" content="/moctelogo.png" />
    <meta property="og:site_name" content="Moctezuma Records" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Moctezuma Records — Vinilos en la Ciudad de México" />
    <meta name="twitter:description" content="Tienda de vinilos en la CDMX. Discos de segunda mano y nuevos." />
    <meta name="twitter:image" content="/moctelogo.png" />

    <!-- Theme color -->
    <meta name="theme-color" content="#f4903c" />

    <!-- Structured data: local business (record store). SameAs points at the
         store's Instagram; geo/address from the Contacto/Ayuda pages. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MusicStore",
        "name": "Moctezuma Records",
        "description": "Tienda de vinilos en la Ciudad de México. Discos de segunda mano y nuevos: LP, CD, 12\", 7\" y más. Envío a domicilio o recoge en tienda.",
        "image": "/moctelogo.png",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Av. África #51",
          "addressLocality": "Venustiano Carranza",
          "addressRegion": "Ciudad de México",
          "addressCountry": "MX"
        },
        "priceRange": "$$",
        "sameAs": ["https://www.instagram.com/moctezuma_records/"]
      }
    </script>

    <!-- Self-hosted webfonts, preloaded: takes the Google Fonts round-trip
         (CSS -> font CSS -> woff2) out of the critical rendering path. -->
    <link
      rel="preload"
      href="/fonts/krona-one-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/work-sans-var-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
